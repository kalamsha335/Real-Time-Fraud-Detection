apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: fraud-detection
data:
  DATABASE_URL: "postgresql+psycopg2://postgres:postgrespassword@postgres-service:5432/fraud_detection"
  KAFKA_BROKER: "kafka-service:9092"
  FRAUD_THRESHOLD: "0.50"
  MLFLOW_TRACKING_URI: "sqlite:///notebooks/mlflow.db"
---
apiVersion: v1
kind: Secret
metadata:
  name: fraud-secrets
  namespace: fraud-detection
type: Opaque
stringData:
  postgres-password: "postgrespassword"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-backend
  namespace: fraud-detection
  labels:
    app: fraud-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-backend
  template:
    metadata:
      labels:
        app: fraud-backend
    spec:
      containers:
        - name: fraud-backend
          image: fraud-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: postgres-password
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: fraud-detection
  labels:
    app: fraud-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: fraud-backend

